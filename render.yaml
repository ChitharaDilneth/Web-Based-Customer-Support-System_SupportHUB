# Render Blueprint Specification for SupportHUB Backend
services:
  - type: web
    name: supporthub-backend
    runtime: docker
    dockerfilePath: ./SupportHUB/backend/Dockerfile
    dockerContext: ./SupportHUB/backend
    region: singapore
    plan: free
    healthCheckPath: /api/categories/active
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
