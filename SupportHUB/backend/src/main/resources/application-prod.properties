# SupportHUB Production Environment Configuration Profile
# In production, all secrets and credentials MUST be provided via Environment Variables.

# Server Port (Binds dynamically to Render's assigned PORT or 8080)
server.port=${PORT:8080}

# Database Configuration (Mandatory Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Production JPA Settings (Strictly validate schema without DDL auto-updates)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=12
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Mandatory Production JWT Secret (Startup will fail if omitted)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Hardened Pagination Max
app.pagination.max-size=100

# File Upload Configuration
file.upload-dir=${UPLOAD_DIR:/app/uploads}

# Production CORS Allowed Origins (Supports *.vercel.app by default and custom domains via environment variable)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app,http://localhost:5500,http://127.0.0.1:5500}
